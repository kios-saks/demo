name: Mother & Baby - DEV Post-deploy Content QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  live-life-course:
    if: >-
      github.repository == 'kios-saks/demo' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/hanh-trinh-me-be-ecosystem') ||
       (github.event_name == 'pull_request' && github.event.pull_request.number == 1 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'feat/hanh-trinh-me-be-ecosystem' &&
        github.event.pull_request.base.ref == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/hanh-trinh-me-be
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-dev-live.mjs
      - run: node scripts/qa-dev-life-course-live.mjs
      - run: node scripts/knowledge-hub-browser-smoke.mjs
