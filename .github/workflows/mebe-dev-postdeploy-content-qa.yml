name: Mother & Baby - DEV Post-deploy Content QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  live-life-course:
    if: >-
      github.repository == 'kios-saks/demo' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/hanh-trinh-me-be-ecosystem') ||
       (github.event_name == 'pull_request' && github.event.pull_request.number == 1 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'feat/hanh-trinh-me-be-ecosystem' &&
        github.event.pull_request.base.ref == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/hanh-trinh-me-be
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-dev-live.mjs
      - run: node scripts/qa-dev-life-course-live.mjs
      - run: node scripts/knowledge-hub-browser-smoke.mjs
      - name: UX-02 live search acceptance (only when candidate is LIVE)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://hanh-trinh-me-be-web-jn5v.onrender.com/tim-kiem';
          const res = await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(90000)});
          if(!res.ok) throw Error('DEV search probe HTTP '+res.status);
          const html=await res.text();
          const {appendFileSync}=await import('node:fs');
          const live=html.includes('data-unified-search="v2"') && html.includes('data-search-fulltext="72"');
          appendFileSync(process.env.GITHUB_ENV,'MEBE_UX02_LIVE='+String(live)+'\n');
          if(!live) console.log('UX02_POSTDEPLOY_SKIP_NOT_LIVE: re-run after candidate deployment; not acceptance');
          NODE
      - name: UX-02 Search Browser Smoke
        if: env.MEBE_UX02_LIVE == 'true'
        run: node scripts/knowledge-search-browser-smoke.mjs
      - name: UX-02 synthetic privacy canary (DEV only)
        if: env.MEBE_UX02_LIVE == 'true'
        run: node scripts/knowledge-search-privacy-canary.mjs
      - name: UX-03 live homepage acceptance (only when candidate is LIVE)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const res=await fetch('https://hanh-trinh-me-be-web-jn5v.onrender.com/',{cache:'no-store',signal:AbortSignal.timeout(90000)});
          if(!res.ok) throw Error('DEV homepage probe HTTP '+res.status);
          const html=await res.text();
          const {appendFileSync}=await import('node:fs');
          const live=html.includes('data-home-v2="1"');
          appendFileSync(process.env.GITHUB_ENV,'MEBE_UX03_LIVE='+String(live)+'\n');
          if(!live) console.log('UX03_POSTDEPLOY_SKIP_NOT_LIVE: re-run after candidate deployment; not acceptance');
          NODE
      - name: UX-03 Homepage Browser Smoke
        if: env.MEBE_UX03_LIVE == 'true'
        run: node scripts/homepage-v2-browser-smoke.mjs
      - name: UX-04 live shell acceptance (only when candidate is LIVE)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const res=await fetch('https://hanh-trinh-me-be-web-jn5v.onrender.com/',{cache:'no-store',signal:AbortSignal.timeout(90000)});
          if(!res.ok) throw Error('DEV shell probe HTTP '+res.status);
          const html=await res.text();
          const {appendFileSync}=await import('node:fs');
          const live=html.includes('data-reader-shell="v2"');
          appendFileSync(process.env.GITHUB_ENV,'MEBE_UX04_LIVE='+String(live)+'\n');
          if(!live) console.log('UX04_POSTDEPLOY_SKIP_NOT_LIVE: re-run after candidate deployment; not acceptance');
          NODE
      - name: UX-04 Reader Shell Browser Smoke
        if: env.MEBE_UX04_LIVE == 'true'
        run: node scripts/reader-shell-browser-smoke.mjs
      - name: UX-05 live discovery acceptance (only when candidate is LIVE)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const res=await fetch('https://hanh-trinh-me-be-web-jn5v.onrender.com/kham-pha',{cache:'no-store',signal:AbortSignal.timeout(90000)});
          if(!res.ok) throw Error('DEV discovery probe HTTP '+res.status);
          const html=await res.text();
          const {appendFileSync}=await import('node:fs');
          const live=html.includes('data-discovery-v2="1"');
          appendFileSync(process.env.GITHUB_ENV,'MEBE_UX05_LIVE='+String(live)+'\n');
          if(!live) console.log('UX05_POSTDEPLOY_SKIP_NOT_LIVE: re-run after candidate deployment; not acceptance');
          NODE
      - name: UX-05 Discovery Browser Smoke
        if: env.MEBE_UX05_LIVE == 'true'
        run: node scripts/discovery-browser-smoke.mjs
      - name: UX-06 live detail acceptance (only when candidate is LIVE)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const res=await fetch('https://hanh-trinh-me-be-web-jn5v.onrender.com/bai-viet/cuoc-tro-chuyen-truoc-khi-co-con',{cache:'no-store',signal:AbortSignal.timeout(90000)});
          if(!res.ok) throw Error('DEV detail probe HTTP '+res.status);
          const html=await res.text();
          const {appendFileSync}=await import('node:fs');
          const live=html.includes('data-detail-v2="1"');
          appendFileSync(process.env.GITHUB_ENV,'MEBE_UX06_LIVE='+String(live)+'\n');
          if(!live) console.log('UX06_POSTDEPLOY_SKIP_NOT_LIVE: re-run after candidate deployment; not acceptance');
          NODE
      - name: UX-06 Detail Browser Smoke
        if: env.MEBE_UX06_LIVE == 'true'
        run: node scripts/detail-browser-smoke.mjs
      - name: UX-07 live bookmark acceptance (only when candidate is LIVE)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const res=await fetch('https://hanh-trinh-me-be-web-jn5v.onrender.com/da-luu',{cache:'no-store',signal:AbortSignal.timeout(90000)});
          if(!res.ok) throw Error('DEV bookmark probe HTTP '+res.status);
          const html=await res.text();
          const {appendFileSync}=await import('node:fs');
          const live=html.includes('data-bookmark-library="1"');
          appendFileSync(process.env.GITHUB_ENV,'MEBE_UX07_LIVE='+String(live)+'\n');
          if(!live) console.log('UX07_POSTDEPLOY_SKIP_NOT_LIVE: re-run after candidate deployment; not acceptance');
          NODE
      - name: UX-07 Bookmark Browser Smoke
        if: env.MEBE_UX07_LIVE == 'true'
        run: node scripts/bookmark-browser-smoke.mjs
