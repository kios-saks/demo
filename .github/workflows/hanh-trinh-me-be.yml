name: Mother & Baby - Web API Mobile CI
on:
  push:
    branches: ["feat/hanh-trinh-me-be-ecosystem"]
    paths:
      - ".github/workflows/hanh-trinh-me-be.yml"
      - "projects/hanh-trinh-me-be/**"
  pull_request:
    paths:
      - ".github/workflows/hanh-trinh-me-be.yml"
      - "projects/hanh-trinh-me-be/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mebe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/hanh-trinh-me-be
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install all workspaces
        run: npm install --no-audit --no-fund
      - name: Content validation
        run: npm run check:content
      - name: API tests
        run: npm test
      - name: API TypeScript
        run: npm exec -w @mebe/api -- tsc --noEmit
      - name: Mobile TypeScript
        run: npm exec -w @mebe/mobile -- tsc --noEmit
      - name: React dependency diagnosis
        run: npm ls react react-dom next --depth=0 || true
      - name: Next.js production build
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: HTTP integration smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm exec -w @mebe/api -- tsx src/server.ts > /tmp/mebe-api.log 2>&1 &
          api_pid=$!
          npm run start -w @mebe/web > /tmp/mebe-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          node scripts/http-smoke.mjs || { cat /tmp/mebe-api.log; cat /tmp/mebe-web.log; exit 1; }
