name: Mother & Baby - Web API Mobile CI
on:
  push:
    branches: ["feat/hanh-trinh-me-be-ecosystem"]
    paths:
      - ".github/workflows/hanh-trinh-me-be.yml"
      - "projects/hanh-trinh-me-be/**"
  pull_request:
    paths:
      - ".github/workflows/hanh-trinh-me-be.yml"
      - "projects/hanh-trinh-me-be/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mebe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/hanh-trinh-me-be
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install all workspaces
        run: npm install --no-audit --no-fund
      - name: Content validation
        run: npm run check:content
      - name: API tests
        run: npm test
      - name: API TypeScript
        run: npm exec -w @mebe/api -- tsc --noEmit
      - name: Mobile TypeScript
        run: npm exec -w @mebe/mobile -- tsc --noEmit
      - name: React dependency diagnosis
        run: npm ls react react-dom next --depth=0 || true
      - name: Next.js production build
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: HTTP integration smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm exec -w @mebe/api -- tsx src/server.ts > /tmp/mebe-api.log 2>&1 &
          api_pid=$!
          npm run start -w @mebe/web > /tmp/mebe-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          node scripts/http-smoke.mjs || { cat /tmp/mebe-api.log; cat /tmp/mebe-web.log; exit 1; }

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mebe
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: mebe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mebe -d mebe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: projects/hanh-trinh-me-be
    env:
      DATABASE_URL: postgresql://mebe:local-test-only@127.0.0.1:5432/mebe
      CONTENT_PROVIDER: postgres
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply PostgreSQL schema migration
        run: npm run db:migrate
      - name: Seed sample data
        run: npm run db:seed
      - name: PostgreSQL integration and editorial concurrency tests
        run: npm run test:postgres
      - name: PostgreSQL-backed API smoke
        shell: bash
        run: |
          set -euo pipefail
          npm exec -w @mebe/api -- tsx src/server.ts > /tmp/mebe-postgres-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          node scripts/postgres-http-smoke.mjs || { cat /tmp/mebe-postgres-api.log; exit 1; }

  db-routing-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      docker-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mebe
          POSTGRES_PASSWORD: docker-test-only
          POSTGRES_DB: mebe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mebe -d mebe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      supabase-target-simulator:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mebe
          POSTGRES_PASSWORD: secondary-test-only
          POSTGRES_DB: mebe
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mebe -d mebe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: projects/hanh-trinh-me-be
    env:
      DOCKER_DATABASE_URL: postgresql://mebe:docker-test-only@127.0.0.1:5432/mebe
      SUPABASE_DATABASE_URL: postgresql://mebe:secondary-test-only@127.0.0.1:5433/mebe
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Dual PostgreSQL routing integration test
        run: npm run test:db-routing

  web-api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/hanh-trinh-me-be
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Web in API mode without a database secret
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          WEB_CONTENT_PROVIDER: api
          CONTENT_API_INTERNAL_URL: http://127.0.0.1:4000
        run: npm run build:web
      - name: Check production public content gate
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production DATABASE_MODE=mock npm exec -w @mebe/api -- tsx src/server.ts > /tmp/mebe-api-prod.log 2>&1 &
          api_pid=$!
          WEB_CONTENT_PROVIDER=api CONTENT_API_INTERNAL_URL=http://127.0.0.1:4000 npm run start -w @mebe/web > /tmp/mebe-web-api.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          node scripts/web-api-production-smoke.mjs || { cat /tmp/mebe-api-prod.log; cat /tmp/mebe-web-api.log; exit 1; }
