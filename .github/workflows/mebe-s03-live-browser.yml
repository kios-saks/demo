name: Mother & Baby - S03 Live Browser QA
on:
  pull_request:
    branches: ["feat/hanh-trinh-me-be-ecosystem"]
    paths:
      - ".github/workflows/mebe-s03-live-browser.yml"
      - "projects/hanh-trinh-me-be/scripts/reader-live-browser-smoke.mjs"
permissions:
  contents: read
jobs:
  live-browser:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/mebe-s03-live-browser'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser
        run: |
          mkdir -p /tmp/mebe-live-browser
          npm install --prefix /tmp/mebe-live-browser --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          /tmp/mebe-live-browser/node_modules/.bin/playwright install --with-deps chromium
          cp projects/hanh-trinh-me-be/scripts/reader-live-browser-smoke.mjs /tmp/mebe-live-browser/
      - name: Read-only live browser acceptance
        env:
          DEV_READER_INVITE_TOKEN: ${{ secrets.DEV_READER_INVITE_TOKEN }}
        run: node /tmp/mebe-live-browser/reader-live-browser-smoke.mjs
