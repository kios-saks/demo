services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: mebe
      POSTGRES_PASSWORD: local-only-change-me
      POSTGRES_DB: mebe
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mebe -d mebe"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
