<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Dấu hiệu cần được đánh giá ngay"><rect width="1200" height="640" fill="#fff9f7"/><rect x="30" y="30" width="1140" height="580" rx="35" fill="#fff0ef" stroke="#f1dfe4" stroke-width="3"/><rect x="60" y="73" width="10" height="74" rx="5" fill="#b66c7a"/><text x="88" y="105" font-family="Arial,sans-serif" fill="#613e55" font-weight="800" font-size="40">Dấu hiệu cần được đánh giá ngay</text><text x="88" y="145" font-family="Arial,sans-serif" fill="#796577" font-size="23">Khi mang thai hoặc sau sinh</text><g><rect x="40" y="215" width="268" height="268" rx="26" fill="#fff" stroke="#efdde2" stroke-width="3"/><circle cx="95" cy="268" r="30" fill="#b66c7a" opacity=".14"/><text x="95" y="279" text-anchor="middle" fill="#b66c7a" font-family="Arial,sans-serif" font-weight="800" font-size="32">1</text><text x="66" y="345" fill="#4a3343" font-family="Arial,sans-serif" font-size="25" font-weight="700">Ra máu nhiều</text><text x="66" y="392" fill="#63535e" font-family="Arial,sans-serif" font-size="19">Hoặc đau bụng</text><text x="66" y="424" fill="#63535e" font-family="Arial,sans-serif" font-size="19">dữ dội</text></g><g><rect x="329" y="215" width="268" height="268" rx="26" fill="#fff" stroke="#efdde2" stroke-width="3"/><circle cx="384" cy="268" r="30" fill="#b66c7a" opacity=".14"/><text x="384" y="279" text-anchor="middle" fill="#b66c7a" font-family="Arial,sans-serif" font-weight="800" font-size="32">2</text><text x="355" y="345" fill="#4a3343" font-family="Arial,sans-serif" font-size="25" font-weight="700">Đau đầu dữ dội</text><text x="355" y="392" fill="#63535e" font-family="Arial,sans-serif" font-size="19">Đặc biệt kèm</text><text x="355" y="424" fill="#63535e" font-family="Arial,sans-serif" font-size="19">thay đổi thị lực</text></g><g><rect x="618" y="215" width="268" height="268" rx="26" fill="#fff" stroke="#efdde2" stroke-width="3"/><circle cx="673" cy="268" r="30" fill="#b66c7a" opacity=".14"/><text x="673" y="279" text-anchor="middle" fill="#b66c7a" font-family="Arial,sans-serif" font-weight="800" font-size="32">3</text><text x="644" y="345" fill="#4a3343" font-family="Arial,sans-serif" font-size="25" font-weight="700">Khó thở</text><text x="644" y="392" fill="#63535e" font-family="Arial,sans-serif" font-size="19">Hoặc đau ngực</text><text x="644" y="424" fill="#63535e" font-family="Arial,sans-serif" font-size="19">bất thường</text></g><g><rect x="907" y="215" width="268" height="268" rx="26" fill="#fff" stroke="#efdde2" stroke-width="3"/><circle cx="962" cy="268" r="30" fill="#b66c7a" opacity=".14"/><text x="962" y="279" text-anchor="middle" fill="#b66c7a" font-family="Arial,sans-serif" font-weight="800" font-size="32">4</text><text x="933" y="345" fill="#4a3343" font-family="Arial,sans-serif" font-size="25" font-weight="700">Ngất, co giật</text><text x="933" y="392" fill="#63535e" font-family="Arial,sans-serif" font-size="19">Cần hỗ trợ</text><text x="933" y="424" fill="#63535e" font-family="Arial,sans-serif" font-size="19">y tế khẩn cấp</text></g><text x="65" y="554" fill="#b66c7a" font-family="Arial,sans-serif" font-size="21" font-weight="700">Nguồn tham khảo: CDC – Hear Her</text><text x="65" y="584" fill="#8b7987" font-family="Arial,sans-serif" font-size="18">Minh họa do Hành Trình Mẹ &amp; Bé biên soạn • Không thay thế tư vấn chuyên môn</text></svg>