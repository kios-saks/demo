<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="3 điểm nhớ khi bắt đầu ăn dặm"><rect width="1200" height="640" fill="#fff9f7"/><rect x="30" y="30" width="1140" height="580" rx="35" fill="#fff0ef" stroke="#f1dfe4" stroke-width="3"/><rect x="60" y="73" width="10" height="74" rx="5" fill="#ac855d"/><text x="88" y="105" font-family="Arial,sans-serif" fill="#613e55" font-weight="800" font-size="40">3 điểm nhớ khi bắt đầu ăn dặm</text><text x="88" y="145" font-family="Arial,sans-serif" fill="#796577" font-size="23">Gợi ý chung theo WHO và NHS</text><g><rect x="40" y="215" width="361.3333333333333" height="268" rx="26" fill="#fff" stroke="#efdde2" stroke-width="3"/><circle cx="95" cy="268" r="30" fill="#ac855d" opacity=".14"/><text x="95" y="279" text-anchor="middle" fill="#ac855d" font-family="Arial,sans-serif" font-weight="800" font-size="32">1</text><text x="66" y="345" fill="#4a3343" font-family="Arial,sans-serif" font-size="29" font-weight="700">Khoảng 6 tháng</text><text x="66" y="392" fill="#63535e" font-family="Arial,sans-serif" font-size="21">Bắt đầu khi trẻ</text><text x="66" y="424" fill="#63535e" font-family="Arial,sans-serif" font-size="21">đã sẵn sàng</text></g><g><rect x="422.3333333333333" y="215" width="361.3333333333333" height="268" rx="26" fill="#fff" stroke="#efdde2" stroke-width="3"/><circle cx="477.3333333333333" cy="268" r="30" fill="#ac855d" opacity=".14"/><text x="477.3333333333333" y="279" text-anchor="middle" fill="#ac855d" font-family="Arial,sans-serif" font-weight="800" font-size="32">2</text><text x="448.3333333333333" y="345" fill="#4a3343" font-family="Arial,sans-serif" font-size="29" font-weight="700">Đa dạng thực phẩm</text><text x="448.3333333333333" y="392" fill="#63535e" font-family="Arial,sans-serif" font-size="21">Chú ý dinh dưỡng</text><text x="448.3333333333333" y="424" fill="#63535e" font-family="Arial,sans-serif" font-size="21">và kết cấu phù hợp</text></g><g><rect x="804.6666666666666" y="215" width="361.3333333333333" height="268" rx="26" fill="#fff" stroke="#efdde2" stroke-width="3"/><circle cx="859.6666666666666" cy="268" r="30" fill="#ac855d" opacity=".14"/><text x="859.6666666666666" y="279" text-anchor="middle" fill="#ac855d" font-family="Arial,sans-serif" font-weight="800" font-size="32">3</text><text x="830.6666666666666" y="345" fill="#4a3343" font-family="Arial,sans-serif" font-size="29" font-weight="700">Luôn giám sát</text><text x="830.6666666666666" y="392" fill="#63535e" font-family="Arial,sans-serif" font-size="21">Cho bé ngồi thẳng</text><text x="830.6666666666666" y="424" fill="#63535e" font-family="Arial,sans-serif" font-size="21">trong suốt bữa ăn</text></g><text x="65" y="554" fill="#ac855d" font-family="Arial,sans-serif" font-size="21" font-weight="700">Nguồn tham khảo: WHO / NHS</text><text x="65" y="584" fill="#8b7987" font-family="Arial,sans-serif" font-size="18">Minh họa do Hành Trình Mẹ &amp; Bé biên soạn • Không thay thế tư vấn chuyên môn</text></svg>