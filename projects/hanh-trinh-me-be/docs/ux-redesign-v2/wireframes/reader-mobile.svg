<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Chi tiết nội dung — Mobile wireframe V2"><title>Chi tiết nội dung</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="390" height="844" rx="0" fill="#FAF9F5" stroke="#FAF9F5"/>
