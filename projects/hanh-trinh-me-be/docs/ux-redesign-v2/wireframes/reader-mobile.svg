<text x="16" y="599" font-size="14" fill="#536459" font-weight="400" text-anchor="start">Đoạn nội dung · mục hướng dẫn</text>
<text x="16" y="620" font-size="14" fill="#536459" font-weight="400" text-anchor="start">Giới hạn áp dụng · đọc tiếp</text>
<text x="16" y="655" font-size="18" fill="#285B46" font-weight="700" text-anchor="start">Nguồn tham khảo</text>
<text x="16" y="681" font-size="13" fill="#285B46" font-weight="400" text-anchor="start">Tài liệu gốc · Bài liên quan →</text>
<rect x="0" y="778" width="390" height="66" rx="0" fill="#FFFFFF" stroke="#D7DED5"/>
