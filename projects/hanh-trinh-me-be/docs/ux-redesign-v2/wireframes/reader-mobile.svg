<text x="28" y="342" font-size="12" fill="#536459" font-weight="400" text-anchor="start">Tóm tắt từ nội dung có sẵn</text>
<text x="28" y="361" font-size="12" fill="#536459" font-weight="400" text-anchor="start">Không thêm nhận định mới.</text>
