<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Trang chủ — Mobile wireframe V2"><title>Trang chủ</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="390" height="844" rx="0" fill="#FAF9F5" stroke="#FAF9F5"/>
<rect x="0" y="0" width="390" height="52" rx="0" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="16" y="32" font-size="16" fill="#285B46" font-weight="700" text-anchor="start">Hành Trình Mẹ &amp; Bé</text>
<text x="372" y="32" font-size="22" fill="#285B46" font-weight="700" text-anchor="end">⌕</text>
<rect x="16" y="62" width="358" height="170" rx="14" fill="#E7EFE5" stroke="#D7DED5"/>
<text x="30" y="91" font-size="20" fill="#285B46" font-weight="400" text-anchor="start">Hôm nay bạn muốn</text>
<text x="30" y="116" font-size="20" fill="#285B46" font-weight="400" text-anchor="start">tìm hiểu điều gì?</text>
<rect x="28" y="134" width="334" height="48" rx="10" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="42" y="163" font-size="14" fill="#536459" font-weight="400" text-anchor="start">⌕  Ăn dặm, AI, tài chính…</text>
<text x="30" y="213" font-size="12" fill="#536459" font-weight="400" text-anchor="start">Tìm theo nhu cầu, không cần đăng nhập</text>
<text x="16" y="262" font-size="18" fill="#285B46" font-weight="700" text-anchor="start">Chọn chặng quan tâm</text>
