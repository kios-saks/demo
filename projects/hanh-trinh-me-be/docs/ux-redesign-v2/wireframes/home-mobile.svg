<rect x="28" y="606" width="44" height="52" rx="6" fill="#E7EFE5" stroke="#D7DED5"/>
<text x="84" y="621" font-size="13" fill="#24362D" font-weight="700" text-anchor="start">Tiếp tục đọc</text>
<text x="84" y="643" font-size="11" fill="#536459" font-weight="400" text-anchor="start">Chỉ xuất hiện khi có dữ liệu</text>
<text x="16" y="710" font-size="14" fill="#285B46" font-weight="700" text-anchor="start">Tất cả kiến thức →</text>
<rect x="0" y="778" width="390" height="66" rx="0" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="48.75" y="803" font-size="22" fill="#285B46" font-weight="700" text-anchor="middle">⌂</text>
<text x="48.75" y="827" font-size="11" fill="#285B46" font-weight="700" text-anchor="middle">Trang chủ</text>
