<text x="73" y="355" font-size="12" fill="#285B46" font-weight="700" text-anchor="middle">18–22 tuổi</text>
<rect x="138" y="328" width="114" height="44" rx="8" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="195" y="355" font-size="12" fill="#285B46" font-weight="700" text-anchor="middle">23–59 tuổi</text>
<rect x="260" y="328" width="114" height="44" rx="8" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="317" y="355" font-size="12" fill="#285B46" font-weight="700" text-anchor="middle">60+ tuổi</text>
