<text x="501" y="379" font-size="15" fill="#285B46" font-weight="700" text-anchor="middle">6–17 tuổi</text>
<rect x="601" y="335" width="174" height="78" rx="8" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="688" y="379" font-size="15" fill="#285B46" font-weight="700" text-anchor="middle">18–22 tuổi</text>
<rect x="788" y="335" width="174" height="78" rx="8" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="875" y="379" font-size="15" fill="#285B46" font-weight="700" text-anchor="middle">23–59 tuổi</text>
<rect x="975" y="335" width="174" height="78" rx="8" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="1062" y="379" font-size="15" fill="#285B46" font-weight="700" text-anchor="middle">60+ tuổi</text>
