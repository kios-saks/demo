<text x="54" y="463" font-size="17" fill="#285B46" font-weight="700" text-anchor="start">Hành trình của bạn</text>
<text x="54" y="484" font-size="14" fill="#536459" font-weight="400" text-anchor="start">Chọn nhiều chặng, tùy chỉnh hoặc bỏ qua</text>
<rect x="584" y="438" width="576" height="78" rx="10" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="598" y="463" font-size="17" fill="#285B46" font-weight="700" text-anchor="start">Đọc tiếp</text>
<text x="598" y="484" font-size="14" fill="#536459" font-weight="400" text-anchor="start">Hiển thị nếu có lịch sử đã bật</text>
<text x="40" y="554" font-size="24" fill="#285B46" font-weight="700" text-anchor="start">Kiến thức dành cho bạn</text>
<rect x="40" y="572" width="548" height="94" rx="10" fill="#FFFFFF" stroke="#D7DED5"/>
<rect x="52" y="584" width="60" height="70" rx="6" fill="#E7EFE5" stroke="#D7DED5"/>
<text x="124" y="599" font-size="17" fill="#24362D" font-weight="700" text-anchor="start">Khám phá sức khỏe và đời sống</text>
<text x="124" y="621" font-size="14" fill="#536459" font-weight="400" text-anchor="start">Chủ đề · Cẩm nang</text>
<rect x="612" y="572" width="548" height="94" rx="10" fill="#FFFFFF" stroke="#D7DED5"/>
<rect x="624" y="584" width="60" height="70" rx="6" fill="#E7EFE5" stroke="#D7DED5"/>
<text x="696" y="599" font-size="17" fill="#24362D" font-weight="700" text-anchor="start">Học tập, công nghệ và tự lập</text>
<text x="696" y="621" font-size="14" fill="#536459" font-weight="400" text-anchor="start">Chủ đề · Bài học</text>
<text x="40" y="794" font-size="13" fill="#536459" font-weight="400" text-anchor="start">Nguồn tham khảo · Quyền riêng tư · Hành Trình Mẹ &amp; Bé</text>
<text x="1160" y="794" font-size="13" fill="#536459" font-weight="400" text-anchor="end">Wireframe V2 · Đề xuất</text></g></svg>
