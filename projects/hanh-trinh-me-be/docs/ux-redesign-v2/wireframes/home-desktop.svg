<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Trang chủ — Desktop wireframe V2"><title>Trang chủ</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#FAF9F5" stroke="#FAF9F5"/>
<rect x="0" y="0" width="1200" height="68" rx="0" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="40" y="42" font-size="23" fill="#285B46" font-weight="700" text-anchor="start">Hành Trình Mẹ &amp; Bé</text>
<text x="580" y="42" font-size="16" fill="#285B46" font-weight="700" text-anchor="start">Trang chủ</text>
<text x="725" y="42" font-size="16" fill="#285B46" font-weight="400" text-anchor="start">Khám phá</text>
<text x="870" y="42" font-size="16" fill="#285B46" font-weight="400" text-anchor="start">Hành trình</text>
<text x="1015" y="42" font-size="16" fill="#285B46" font-weight="400" text-anchor="start">Cá nhân</text>
<rect x="40" y="86" width="1120" height="190" rx="16" fill="#E7EFE5" stroke="#D7DED5"/>
<text x="70" y="137" font-size="35" fill="#285B46" font-weight="700" text-anchor="start">Hôm nay bạn muốn tìm hiểu điều gì?</text>
<text x="70" y="174" font-size="18" fill="#536459" font-weight="400" text-anchor="start">Đồng hành cùng bạn và gia đình qua từng chặng đời.</text>
<rect x="70" y="195" width="730" height="58" rx="10" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="84" y="230" font-size="18" fill="#536459" font-weight="400" text-anchor="start">⌕  Giấc ngủ, ăn dặm, AI, tài chính…</text>
<rect x="830" y="195" width="200" height="58" rx="8" fill="#285B46" stroke="#285B46"/>
<text x="930" y="229" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Khám phá</text>
<text x="40" y="317" font-size="24" fill="#285B46" font-weight="700" text-anchor="start">Chọn chặng quan tâm</text>
<rect x="40" y="335" width="174" height="78" rx="8" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="127" y="379" font-size="15" fill="#285B46" font-weight="700" text-anchor="middle">Đón bé</text>
<rect x="227" y="335" width="174" height="78" rx="8" fill="#FFFFFF" stroke="#D7DED5"/>
<text x="314" y="379" font-size="15" fill="#285B46" font-weight="700" text-anchor="middle">0–5 tuổi</text>
